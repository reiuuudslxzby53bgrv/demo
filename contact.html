<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - S. Kaczynski</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@500;700&family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">

        <div class="hc">
            <nav class="navbar navbar-expand-lg w-100 p-0">
                <a class="logo navbar-brand m-0" href="index.html" aria-label="Go to Home page"><span class="li">🐾</span><span class="lt">S. Kaczynski</span></a>
                <input type="checkbox" id="navToggleContact" class="nav-toggle" aria-label="Toggle navigation">
                <label for="navToggleContact" class="nav-toggle-btn" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <div class="collapse navbar-collapse" id="mainNavContact">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="products.html">Shop All</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Contact</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="hcp">
            <div class="hcl">
                <p class="hcm">Contact Us</p>
                <h2>Get In<br>Touch</h2>
            </div>
            <form class="hcf" action="#" method="POST">
                <div class="hcr">
                    <div class="hfd">
                        <label for="contactFirstName">First name</label>
                        <input id="contactFirstName" name="contactFirstName" type="text" placeholder="Enter your first name" required minlength="2">
                    </div>
                    <div class="hfd">
                        <label for="contactEmail">Email *</label>
                        <input id="contactEmail" name="contactEmail" type="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="hfd">
                    <label for="contactSubject">Subject</label>
                    <input id="contactSubject" name="contactSubject" type="text" placeholder="e.g., Support" required minlength="3">
                </div>
                <div class="hfd">
                    <label for="contactMessage">Write a message</label>
                    <textarea id="contactMessage" name="contactMessage" rows="5" placeholder="Enter text here" required minlength="10"></textarea>
                </div>
                <button class="hcs" type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="fth"><span class="ftl">🐾 S. Kaczynski</span></div>
        
        <div class="ftb"><p>© 2026 by S. Kaczynski</p></div>
    </footer>
</body>
</html>
