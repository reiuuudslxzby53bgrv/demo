<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Reset your Foodie account password." />
    <title>Reset Password — Foodie</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="reset-password.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-card" style="width: min(420px, 100%);">
      <header class="auth-heading">
        <h1>Reset Password</h1>
        <p>Recover access to your Foodie account</p>
      </header>

      <p id="message" role="status" aria-live="polite" class="auth-message" style="display:none; margin-bottom:12px;"></p>

      <!-- Step 1: Request code -->
      <section style="margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #eee;">
        <h2 style="font-size: 14px; margin: 0 0 10px; color: #333;">1. Request Reset Code</h2>
        <form class="auth-form" id="forgotPasswordForm">
          <label class="auth-field" for="forgotPasswordEmail">
            <span>Email</span>
            <input id="forgotPasswordEmail" name="email" type="email" placeholder="you@example.com" required />
          </label>
          <button class="auth-submit" type="submit">Send Reset Code</button>
        </form>
      </section>

      <!-- Step 2: Set new password -->
      <section>
        <h2 style="font-size: 14px; margin: 0 0 10px; color: #333;">2. Set New Password</h2>
        <form class="auth-form" id="resetPasswordForm">
          <label class="auth-field" for="resetPasswordEmail">
            <span>Email</span>
            <input id="resetPasswordEmail" name="email" type="email" placeholder="you@example.com" required />
          </label>
          <label class="auth-field" for="resetPasswordCode">
            <span>Reset Code / Token</span>
            <input id="resetPasswordCode" name="code" type="text" placeholder="Enter code received" required />
          </label>
          <label class="auth-field" for="resetNewPassword">
            <span>New Password</span>
            <input id="resetNewPassword" name="newPassword" type="password" placeholder="At least 8 characters" minlength="8" required />
          </label>
          <button class="auth-submit" type="submit">Set New Password</button>
        </form>
      </section>

      <footer class="auth-footer" style="margin-top: 18px;">
        <p>Remembered your password? <a href="login.html">Sign in</a></p>
      </footer>
    </main>
  </body>
</html>
